services:
  api:
    build:
      context: .
      dockerfile: src/CashFlowArchitecture.Api/Dockerfile
      target: runtime
    container_name: cash-flow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cash_flow};Username=${POSTGRES_USER:-cash_flow_user};Password=${POSTGRES_PASSWORD:-cash_flow_password}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-cash_flow_user}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-cash_flow_password}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE:-cash-flow.events}
      RabbitMq__Queue: ${RABBITMQ_ENTRY_CREATED_QUEUE:-cash-flow.entry-created}
      RabbitMq__RoutingKey: ${RABBITMQ_ENTRY_CREATED_ROUTING_KEY:-entry.created}
    ports:
      - "${API_PORT:-5099}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  consolidation-worker:
    build:
      context: .
      dockerfile: src/CashFlowArchitecture.Worker/Dockerfile
      target: runtime
    container_name: cash-flow-consolidation-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cash_flow};Username=${POSTGRES_USER:-cash_flow_user};Password=${POSTGRES_PASSWORD:-cash_flow_password}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-cash_flow_user}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-cash_flow_password}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE:-cash-flow.events}
      RabbitMq__Queue: ${RABBITMQ_ENTRY_CREATED_QUEUE:-cash-flow.entry-created}
      RabbitMq__RoutingKey: ${RABBITMQ_ENTRY_CREATED_ROUTING_KEY:-entry.created}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  migrations:
    build:
      context: .
      dockerfile: src/CashFlowArchitecture.Api/Dockerfile
      target: migrations
    container_name: cash-flow-migrations
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cash_flow};Username=${POSTGRES_USER:-cash_flow_user};Password=${POSTGRES_PASSWORD:-cash_flow_password}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: cash-flow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cash_flow}
      POSTGRES_USER: ${POSTGRES_USER:-cash_flow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cash_flow_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cash_flow_user} -d ${POSTGRES_DB:-cash_flow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5-standalone
    container_name: cash-flow-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: cash-flow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cash_flow_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-cash_flow_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
